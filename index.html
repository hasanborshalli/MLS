<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary SEO -->
        <title>
            MLS Sound &amp; Lighting | Professional Sound &amp; Lighting in
            Lebanon
        </title>
        <meta
            name="description"
            content="MLS Sound & Lighting provides professional sound and lighting solutions in Lebanon. Explore our services and get in touch for your next project."
        />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://mlslightandsound.com/" />

        <!-- Favicon -->
        <link rel="icon" type="image/jpeg" href="/mls-logo.jpg" />

        <!-- Open Graph: Facebook, WhatsApp, LinkedIn -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MLS Sound & Lighting" />
        <meta
            property="og:title"
            content="MLS Sound & Lighting | Professional Sound & Lighting in Lebanon"
        />
        <meta
            property="og:description"
            content="Professional sound and lighting solutions in Lebanon. Explore MLS Sound & Lighting services."
        />
        <meta property="og:url" content="https://mlslightandsound.com/" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary" />
        <meta
            name="twitter:title"
            content="MLS Sound & Lighting | Professional Sound & Lighting in Lebanon"
        />
        <meta
            name="twitter:description"
            content="Professional sound and lighting solutions in Lebanon."
        />

        <meta name="theme-color" content="#ffffff" />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "MLS Sound & Lighting",
                "url": "https://mlslightandsound.com/",
                "description": "Professional sound systems, lighting design, DJ services and event production.",
                "hasOfferCatalog": {
                    "@type": "OfferCatalog",
                    "name": "Event Production Services",
                    "itemListElement": [
                        {
                            "@type": "OfferCatalog",
                            "name": "Sound Systems"
                        },
                        {
                            "@type": "OfferCatalog",
                            "name": "Lighting Design"
                        },
                        {
                            "@type": "OfferCatalog",
                            "name": "DJ Services"
                        },
                        {
                            "@type": "OfferCatalog",
                            "name": "Event Production"
                        }
                    ]
                }
            }
        </script>
    </body>
</html>
